[project]
name = "telethon-selfbot"
version = "1.0.0"
description = "Telegram userbot + helper bot panel"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["telethon.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
